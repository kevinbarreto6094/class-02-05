<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Suma con do...while</title>
</head>
<body>
    <script>
        var numero = prompt("Escribe un número del 0 al 100:");
        numero = parseInt(numero);

        if (numero >= 0 && numero <= 100) {
            var x = 0;
            var suma = 0;
            var mensaje = "";

            do {
                suma += x;
                mensaje += x;

                if (x < numero) {
                    mensaje += "+";
                }

                x++;
            } while (x <= numero);

            document.write(mensaje + "=" + suma);
        } else {
            document.write("Ingrese un número válido entre 0 y 100.");
        }
    </script>
</body>
</html>
