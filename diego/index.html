<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Primera Web</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        section {
            padding: 40px 20px;
            text-align: center;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #00c6ff;
            color: #000;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0072ff;
            color: white;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenido a Mi Web</h1>
        <p>Creada por Kevin 🚀</p>
    </header>

    <section>
        <div class="card">
            <h2>Sobre mí</h2>
            <p>Soy creador de proyectos digitales, web, IA y contenido motivacional.</p>
        </div>

        <div class="card">
            <h2>Mi objetivo</h2>
            <p>Crear, crecer y generar ingresos online sin límites.</p>
        </div>

        <button onclick="alert('Vamos con todo 💪🔥')">Contáctame</button>
    </section>

    <footer>
        © 2026 - Todos los derechos reservados
    </footer>

</body>
</html>
